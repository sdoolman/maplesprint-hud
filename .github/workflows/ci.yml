name: CI, Release & Pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [codec-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  forwarder-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forwarder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Resolve Go module dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -v ./...
      - name: Build Windows & Linux endpoint binaries
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/maplesprint-endpoint-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/wg-forwarder-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/wg-forwarder-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: maplesprint-endpoint-binaries
          path: dist/*
      - name: Publish rolling 'latest' GitHub Release (Windows & Linux binaries)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ../dist/* --clobber
          else
            gh release create latest ../dist/* \
              --target main \
              --title "Latest Endpoint Relay Binaries" \
              --notes "Pre-built Windows (maplesprint-endpoint-windows-amd64.exe) and Linux (wg-forwarder-linux-amd64 / arm64) relay binaries."
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  hud-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax & HUD verification
        run: |
          node --check app.js
          node --test verify.mjs

  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    needs: [hud-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static HUD files into _site
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          if [ -d data ]; then cp -r data _site/; fi
      - name: Pull pre-built codec.mjs release artifact from maple-collector
        env:
          GH_TOKEN: ${{ secrets.COLLECTOR_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh release download latest --repo sdoolman/maple-collector --pattern "codec.mjs" --dir _site --clobber
            ls -lh _site/codec.mjs
          else
            echo "COLLECTOR_RELEASE_TOKEN not set; skipping private release asset pull"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
