<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MapleSprint HUD</title>
  <link rel="stylesheet" href="style.css?v=20261114b" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>MapleSprint HUD</h1>
        <p id="mapLine" class="muted">Not connected</p>
      </div>
      <div class="top-actions">
        <button id="wakeBtn" class="pill wake" type="button" aria-pressed="false" title="Keep screen awake">☀ Wake</button>
        <span id="statusDot" class="pill offline">OFFLINE</span>
      </div>
    </header>

    <section class="card config">
      <div class="config-group">
        <div class="label">TELEMETRY ROOM (WORKER)</div>
        <div class="row-worker">
          <input id="workerUrl" type="url" placeholder="Worker URL (e.g. https://maplesprint-hub.example.workers.dev)" />
          <input id="roomId" type="text" placeholder="Room ID (e.g. my-room)" />
        </div>
        <div class="actions">
          <button id="connectBtn" type="button">Connect Room</button>
          <button id="shareBtn" class="btn-sec" type="button">Share Link</button>
          <button id="resetBtn" class="btn-sec" type="button">Reset Room</button>
        </div>
      </div>

      <div class="config-group divider">
        <div class="label-row">
          <div class="label">GAME DATA SOURCE (CATALOG)</div>
          <span id="dbStatus" class="muted small">Loading...</span>
        </div>
        <select id="dbSource">
          <option value="https://osmsdataexplorer.com/data/current/">OSMS Data Explorer (osmsdataexplorer.com)</option>
          <option value="custom">Custom Catalog URL...</option>
        </select>
        <input id="dbBase" class="hidden" hidden type="url" placeholder="Custom catalog base URL (must serve maps.json, monsters.json, items.json)" />
      </div>
    </section>

    <section class="grid">
      <div class="card"><div class="label">EXP / HR</div><div id="xph" class="val accent">0</div></div>
      <div class="card"><div class="label">SESSION EXP</div><div id="sessionExp" class="val">0</div></div>
      <div class="card"><div class="label">KILLS</div><div id="kills" class="val">0</div></div>
      <div class="card"><div class="label">KILLS / MIN</div><div id="kpm" class="val">0.0</div></div>
      <div class="card"><div class="label">HP</div><div id="hp" class="val hp">--</div></div>
      <div class="card"><div class="label">MP</div><div id="mp" class="val mp">--</div></div>
      <div class="card"><div class="label">MESOS</div><div id="mesos" class="val gold">0</div></div>
      <div class="card"><div class="label">DROPS</div><div id="drops" class="val accent">0</div></div>
    </section>

    <section class="card">
      <div class="label">LIVE FEED</div>
      <ul id="feed" class="feed"></ul>
    </section>
  </main>
  <script src="app.js?v=20261114b"></script>
</body>
</html>
